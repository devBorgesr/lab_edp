<!doctype html>
<meta charset="utf-8">
<title>Agent Runtime — transporte</title>
<!--
  Cliente v1 do transporte (DECISAO_TRANSPORTE.md, opcao A).

  Servida PELO PROPRIO servidor, em GET /. Isso e o que dispensa CORS: mesma
  origem que POST /v1/tarefas. Enquanto este for o unico cliente, nenhuma
  outra origem consegue falar com o runtime.

  O token NAO vem embutido nem e persistido: campo type=password, sem
  localStorage, sem sessionStorage. Mesma disciplina do campo de API key do
  dashboard do EDP.

  Esta pagina NAO faz parte do Exportador. A assinatura de 03/09 nao autoriza
  tocar em copilot/panel.js — o painel vira o segundo cliente em etapa propria.
-->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  body { margin: 0; background: #0d1117; color: #e6edf3;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace }
  header { padding: 14px 20px; border-bottom: 1px solid #21262d;
           display: flex; align-items: baseline; gap: 12px }
  h1 { margin: 0; font-size: 14px; letter-spacing: .08em; text-transform: uppercase }
  .sub { color: #7d8590; font-size: 11px }
  main { padding: 20px; max-width: 900px }
  fieldset { border: 1px solid #21262d; border-radius: 6px; padding: 14px;
             margin: 0 0 16px }
  legend { color: #7d8590; font-size: 11px; letter-spacing: .08em;
           text-transform: uppercase; padding: 0 6px }
  label { display: block; color: #7d8590; font-size: 11px; margin: 0 0 4px }
  input, textarea { width: 100%; background: #010409; color: #e6edf3;
                    border: 1px solid #30363d; border-radius: 5px;
                    padding: 8px 10px; font: inherit }
  textarea { min-height: 150px; resize: vertical }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px }
  button { background: #7c5cff; color: #fff; border: 0; border-radius: 5px;
           padding: 8px 14px; font: inherit; cursor: pointer }
  button.sec { background: #21262d; color: #e6edf3 }
  button:disabled { opacity: .5; cursor: default }
  pre { background: #010409; border: 1px solid #21262d; border-radius: 6px;
        padding: 12px; overflow: auto; max-height: 460px; margin: 0 }
  .st { margin-left: auto; font-size: 11px; color: #7d8590 }
  .ok { color: #3fb950 } .err { color: #f85149 }
</style>

<header>
  <h1>Agent Runtime — transporte</h1>
  <span class="sub">opcao A · request/response · sem streaming · 127.0.0.1</span>
  <span class="st" id="st">—</span>
</header>

<main>
  <fieldset>
    <legend>Autenticacao</legend>
    <label for="tok">AGENT_RUNTIME_TOKEN (nao e salvo em lugar nenhum)</label>
    <input id="tok" type="password" autocomplete="off" spellcheck="false"
           placeholder="cole o token com que o servidor subiu">
  </fieldset>

  <fieldset>
    <legend>TarefaRequest v1</legend>
    <textarea id="req" spellcheck="false">{
  "schema": "TarefaRequest v1",
  "objetivo": "provar o transporte fim-a-fim",
  "capacidades": ["analyze.json"],
  "max_iteracoes": 3,
  "max_segundos": 10,
  "criada_por": "pagina_teste"
}</textarea>
    <div class="linha">
      <button id="b-post">POST /v1/tarefas</button>
      <button id="b-est"  class="sec">GET estado</button>
      <button id="b-res"  class="sec">GET resultado</button>
      <button id="b-can"  class="sec">POST cancelar</button>
      <button id="b-caps" class="sec">GET /v1/capacidades</button>
      <button id="b-hp"   class="sec">GET /health</button>
    </div>
    <div class="linha">
      <label for="tid" style="margin:0;align-self:center">task_id</label>
      <input id="tid" style="flex:1;min-width:220px" readonly
             placeholder="preenchido pelo POST">
    </div>
  </fieldset>

  <fieldset>
    <legend>Resposta</legend>
    <pre id="out">—</pre>
  </fieldset>
</main>

<script>
(function () {
  var out = document.getElementById('out');
  var st  = document.getElementById('st');
  var tid = document.getElementById('tid');

  function mostra(rotulo, status, corpo) {
    var bom = status >= 200 && status < 300;
    st.textContent = rotulo + ' \u2192 ' + status;
    st.className = 'st ' + (bom ? 'ok' : 'err');
    out.textContent = typeof corpo === 'string'
      ? corpo : JSON.stringify(corpo, null, 2);
  }

  function tok() {
    var t = document.getElementById('tok').value.trim();
    // Sem token o servidor devolveria 401 e a pagina culparia o servidor por
    // um erro do operador. Melhor dizer aqui de quem e a falta.
    if (!t) { mostra('local', 0, 'Cole o token antes de enviar.'); return null; }
    return t;
  }

  function trava(v) {
    document.querySelectorAll('button').forEach(function (b) { b.disabled = v; });
  }

  function pede(url, opcoes) {
    var t = tok(); if (!t) return null;
    opcoes = opcoes || {};
    opcoes.headers = Object.assign(
      { 'Accept': 'application/json', 'Authorization': 'Bearer ' + t },
      opcoes.headers || {});
    return fetch(url, opcoes).then(function (r) {
      return r.text().then(function (txt) {
        var corpo; try { corpo = JSON.parse(txt); } catch (e) { corpo = txt; }
        return { status: r.status, corpo: corpo };
      });
    });
  }

  function chama(rotulo, url, opcoes) {
    var p = pede(url, opcoes); if (!p) return;
    trava(true); st.textContent = rotulo + ' \u2026'; st.className = 'st';
    p.then(function (r) { mostra(rotulo, r.status, r.corpo); })
     .catch(function (e) { mostra(rotulo, 0, 'falha de rede: ' + e.message); })
     .then(function () { trava(false); });
  }

  function precisaId() {
    if (!tid.value) { mostra('local', 0, 'Submeta uma tarefa primeiro.'); return null; }
    return tid.value;
  }

  // A tarefa roda FORA da requisicao: o POST devolve 202 + task_id, e o
  // resultado so existe depois. Por isso a pagina consulta em vez de esperar
  // na conexao — foi exatamente a confusao entre as duas coisas que fez a
  // primeira versao deste transporte nascer sincrona.
  function acompanha(id, tentativas) {
    if (tentativas <= 0) {
      mostra('GET estado', 0, 'ainda rodando; consulte manualmente.'); trava(false); return;
    }
    var p = pede('/v1/tarefas/' + id); if (!p) { trava(false); return; }
    p.then(function (r) {
      mostra('GET /v1/tarefas/' + id, r.status, r.corpo);
      if (r.status === 200 && r.corpo && r.corpo.terminal === false) {
        setTimeout(function () { acompanha(id, tentativas - 1); }, 500);
      } else {
        trava(false);
      }
    }).catch(function (e) {
      mostra('GET estado', 0, 'falha de rede: ' + e.message); trava(false);
    });
  }

  document.getElementById('b-hp').onclick = function () {
    chama('GET /health', '/health');
  };
  document.getElementById('b-caps').onclick = function () {
    chama('GET /v1/capacidades', '/v1/capacidades');
  };
  document.getElementById('b-est').onclick = function () {
    var id = precisaId(); if (id) chama('GET estado', '/v1/tarefas/' + id);
  };
  document.getElementById('b-res').onclick = function () {
    var id = precisaId();
    if (id) chama('GET resultado', '/v1/tarefas/' + id + '/resultado');
  };
  document.getElementById('b-can').onclick = function () {
    var id = precisaId();
    if (id) chama('POST cancelar', '/v1/tarefas/' + id + '/cancelar',
                  { method: 'POST' });
  };
  document.getElementById('b-post').onclick = function () {
    var texto = document.getElementById('req').value;
    try { JSON.parse(texto); }
    catch (e) { mostra('local', 0, 'JSON invalido na caixa: ' + e.message); return; }
    var p = pede('/v1/tarefas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
                 'X-Correlation-Id': 'pagina-' + Date.now() },
      body: texto });
    if (!p) return;
    trava(true); st.textContent = 'POST /v1/tarefas \u2026'; st.className = 'st';
    p.then(function (r) {
      mostra('POST /v1/tarefas', r.status, r.corpo);
      if (r.status === 202 && r.corpo && r.corpo.task_id) {
        tid.value = r.corpo.task_id;
        acompanha(r.corpo.task_id, 20);
      } else {
        trava(false);
      }
    }).catch(function (e) {
      mostra('POST /v1/tarefas', 0, 'falha de rede: ' + e.message); trava(false);
    });
  };
})();
</script>
